# determinator — default model per tier (sourceable shell fragment).
# Override per-shell by exporting DET_*_MODEL before launching a tier.
#
#   local   = a truly-local Ollama model (must be pulled; fits your RAM).
#   cloud   = an Ollama ":cloud" model (requires `ollama signin`).
#   premium = an Anthropic model served via your Claude subscription (or API key).
#
# Verify current cloud tags at: https://ollama.com/search?c=cloud

DET_LOCAL_MODEL="llama3.1:8b"
DET_CLOUD_MODEL="qwen3-coder:480b-cloud"
DET_PREMIUM_MODEL="claude-opus-4-8"
